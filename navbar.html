<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@500&family=VT323&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 8px;
    background: transparent;
    display: flex;
    justify-content: center;
    font-family: 'Bitcount Single Ink', 'VT323', monospace;
    font-weight: 500;
    --google-font-color-bitcountsingleink: none;
  }
  .nav-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    background-color: #FFF9FB;
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid #F4B8C8;
    box-shadow: 3px 3px 0px #FADADD;
  }
  .nav-btn {
    text-decoration: none;
    color: #5C4B51;
    background-color: #FFE4E9;
    padding: 8px 14px;
    border-radius: 8px;
    border: 2px solid #F7C5D1;
    box-shadow: 2px 2px 0px #F2B5C4;
    font-size: 16px;
    line-height: 1.2;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-btn:hover {
    background-color: #FFC2D1;
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px #F2B5C4;
  }
  /* Pastel variations */
  .nav-btn.mint {
    background-color: #E0F5EA;
    border-color: #BCE3CE;
    box-shadow: 2px 2px 0px #A8D6BD;
  }
  .nav-btn.mint:hover { background-color: #C2EBD6; }

  .nav-btn.lavender {
    background-color: #EFE6FA;
    border-color: #D7C4F0;
    box-shadow: 2px 2px 0px #C3ACE3;
  }
  .nav-btn.lavender:hover { background-color: #DEC9F5; }

  .nav-btn.butter {
    background-color: #FFF5D6;
    border-color: #F2DF9E;
    box-shadow: 2px 2px 0px #E6CE7E;
  }
  .nav-btn.butter:hover { background-color: #FFE9A8; }
</style>
</head>
<body>

<div class="nav-container">
  <a href="https://carlygracealexis.notion.site/" target="_top" class="nav-btn">♡ Home</a>
  <a href="https://notion.site" target="_top" class="nav-btn mint">✨ The Library</a>
  <a href="https://notion.site" target="_top" class="nav-btn lavender">⚔️ The War Room</a>
  <a href="https://notion.site" target="_top" class="nav-btn butter">🧸 ID Cards</a>
</div>

</body>
</html>
